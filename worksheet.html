<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lembar Kerja - LumiBell</title>
    <!-- Tailwind Compiled CSS -->
    <link rel="stylesheet" href="dist/output.css">
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@300;400;500;600;700&family=Quicksand:wght@500;700&display=swap" rel="stylesheet">
    <!-- FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        body {
            font-family: 'Quicksand', sans-serif;
            background-color: #FFFDF0;
            user-select: none;
        }
        h1, h2, h3, .brand-font {
            font-family: 'Fredoka', sans-serif;
        }
        
        /* Grid Penuntun Menulis 3 Garis */
        .tracing-guideline {
            background: linear-gradient(to bottom, 
                transparent 0px, transparent 19px, 
                #f43f5e 20px, #f43f5e 21px, 
                transparent 22px, transparent 49px, 
                #3b82f6 50px, #3b82f6 51px, 
                transparent 52px, transparent 79px, 
                #f43f5e 80px, #f43f5e 81px, 
                transparent 82px) left top / 100% 100px;
        }
        .dotted-letter {
            font-family: 'Fredoka', sans-serif;
            color: rgba(148, 163, 184, 0.25);
            text-shadow: 2px 2px 0px rgba(255,255,255,0.9);
            -webkit-text-stroke: 2px dashed #94a3b8;
            font-size: 5rem;
            line-height: 100px;
            display: inline-block;
            text-align: center;
        }
        
        /* Kertas Print Mode */
        @media print {
            body { background: white !important; color: black !important; }
            .no-print { display: none !important; }
            .print-page {
                page-break-after: always;
                border: none !important;
                box-shadow: none !important;
                background: white !important;
                width: 100% !important;
            }
            .tracing-canvas { border: 1px solid #ccc !important; }
            /* Force SVG black and white in print */
            svg path, svg circle, svg rect, svg polygon { stroke: #334155 !important; }
        }
        
        /* Custom scrollbar */
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: #FFFDF0; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }
        
        @keyframes float {
            0%, 100% { transform: translateY(0) rotate(0deg); }
            50% { transform: translateY(-10px) rotate(3deg); }
        }
        .animate-float { animation: float 3s ease-in-out infinite; }

        .tracing-canvas {
            touch-action: none; /* Prevent scroll while drawing */
        }

        .paintable { cursor: pointer; transition: filter 0.15s; }
        .paintable:hover { filter: brightness(1.1); }
        
        /* Confetti Animation */
        @keyframes confettiFall {
            0% { transform: translateY(-100vh) rotate(0deg); opacity: 1; }
            100% { transform: translateY(100vh) rotate(720deg); opacity: 0; }
        }
        .confetti-piece {
            position: fixed;
            width: 10px; height: 10px;
            background-color: #f43f5e;
            top: 0;
            z-index: 100;
            animation: confettiFall 3s ease-in forwards;
        }
    </style>
</head>
<body class="min-h-screen flex flex-col antialiased text-slate-800 pb-12">

    <!-- Loading Screen -->
    <div id="loading-screen" class="fixed inset-0 bg-white z-50 flex flex-col items-center justify-center">
        <div class="w-16 h-16 border-4 border-amber-200 border-t-amber-500 rounded-full animate-spin mb-4"></div>
        <p class="font-bold text-amber-800 brand-font">Menyiapkan Lembar Kerja...</p>
    </div>

                </div>

                        <circle cx="32" cy="52" r="6" fill="#F59E0B" stroke="#D97706" stroke-width="3"/>
                        <circle cx="25" cy="26" r="4" fill="#1E293B"/>
                        <circle cx="39" cy="26" r="4" fill="#1E293B"/>
                        <circle cx="26" cy="25" r="1.5" fill="white"/>
                        <circle cx="40" cy="25" r="1.5" fill="white"/>
                        <path id="lumi-smile" d="M29 32C29 33.6569 30.3431 35 32 35C33.6569 35 35 33.6569 35 32" stroke="#1E293B" stroke-width="3" stroke-linecap="round"/>

                    <button onclick="setBrushColor('#eab308', this)" class="color-btn w-10 h-10 rounded-full bg-yellow-500 border-4 border-white shadow hover:scale-105 transition-transform"></button>

                    <button onclick="setFillColor('#4ade80')" class="w-7 h-7 rounded-full bg-green-400 border-2 border-white shadow hover:scale-110"></button>
                    <button onclick="setFillColor('#3b82f6')" class="w-7 h-7 rounded-full bg-blue-500 border-2 border-white shadow hover:scale-110"></button>
                    <button onclick="setFillColor('#a855f7')" class="w-7 h-7 rounded-full bg-purple-500 border-2 border-white shadow hover:scale-110"></button>
                    <button onclick="setFillColor('#ec4899')" class="w-7 h-7 rounded-full bg-pink-500 border-2 border-white shadow hover:scale-110"></button>
                    <button onclick="setFillColor('#ffffff')" class="w-7 h-7 rounded-full bg-white border-2 border-slate-300 shadow hover:scale-110"></button>

            </div>

            <!-- Panel Navigasi Lembar Kerja -->
            <div class="bg-white border-2 border-slate-100 rounded-3xl p-4 shadow-sm flex-grow overflow-y-auto max-h-[300px]">
                <h4 class="font-bold text-slate-700 text-sm border-b pb-2 mb-2 sticky top-0 bg-white z-10">Daftar Latihan:</h4>
                <div id="navigation-list" class="flex flex-col gap-1.5">

                    <!-- Kiri: Ilustrasi -->

                </div>
                
                <!-- Navigasi Bawah -->
                <div class="flex justify-between items-center mt-6 pt-4 border-t border-slate-100 no-print">
                    <button onclick="prevItem()" class="bg-slate-100 hover:bg-slate-200 text-slate-700 px-5 py-2.5 rounded-2xl font-bold text-sm flex items-center gap-2 transition-all">

                        Lanjut <i class="fa-solid fa-arrow-right"></i>
                    </button>
                </div>

            </div>
        </section>

    </main>

    <!-- Audio Context for Success Sound -->
    <script>
        const AudioContext = window.AudioContext || window.webkitAudioContext;
        const audioCtx = new AudioContext();
        
        function playSuccessSound() {
            if(audioCtx.state === 'suspended') audioCtx.resume();
            
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            
            osc.type = 'sine';
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            
            osc.frequency.setValueAtTime(523.25, audioCtx.currentTime); // C5
            osc.frequency.setValueAtTime(659.25, audioCtx.currentTime + 0.1); // E5
            osc.frequency.setValueAtTime(783.99, audioCtx.currentTime + 0.2); // G5
            osc.frequency.setValueAtTime(1046.50, audioCtx.currentTime + 0.3); // C6
            
            gain.gain.setValueAtTime(0, audioCtx.currentTime);
            gain.gain.linearRampToValueAtTime(0.3, audioCtx.currentTime + 0.05);
            gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.8);
            
            osc.start();
            osc.stop(audioCtx.currentTime + 0.8);
        }
    </script>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
    <script>
        // --- Core App Logic ---
        const CSV_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vSQlOKuGsbSmURap7A9_gszXzYTborbjQMilEloYE6M6jO39P0ymNKH3Mvngymsf-He23T3WizddLbR/pub?output=csv";
        let worksheetData = [];
        let currentIndex = 0;
        let currentCategory = new URLSearchParams(window.location.search).get('category') || 'alphabet';
        let currentItem = null;

        // Theme map
        const themes = {
            'alphabet': { color: 'indigo', hex: '#4f46e5', label: 'Huruf A-Z' },
            'number': { color: 'rose', hex: '#e11d48', label: 'Angka 0-9' },
            'shape': { color: 'amber', hex: '#d97706', label: 'Bentuk & Warna' },
            'warmup': { color: 'emerald', hex: '#059669', label: 'Motorik Halus' }
        };
        const theme = themes[currentCategory] || themes['alphabet'];

        // Apply Theme to UI
        document.getElementById('header-subtitle').innerText = theme.label;
        document.getElementById('header-subtitle').classList.add(`text-${theme.color}-500`);
        document.getElementById('worksheet-container').classList.add(`border-${theme.color}-400`);
        document.getElementById('btn-sound').classList.add(`bg-${theme.color}-500`, `hover:bg-${theme.color}-600`);
        document.getElementById('btn-finish').classList.add(`bg-${theme.color}-500`);
        document.getElementById('mascot-box').classList.add(`border-${theme.color}-300`);

        // Fetch Data
        Papa.parse(CSV_URL, {
            download: true,
            header: true,
            complete: function(results) {
                // Filter by category
                worksheetData = results.data.filter(row => row.Category === currentCategory && row.Item_ID);
                if(worksheetData.length === 0) {
                    alert("Kategori tidak ditemukan atau kosong!");
                    window.location.href = "index.html";
                    return;
                }
                document.getElementById('loading-screen').classList.add('hidden');
                document.getElementById('main-content').classList.remove('opacity-0');
                
                renderSidebarList();
                loadItem(0);
            }
        });

        // --- Render Functions ---
        function renderSidebarList() {
            const listEl = document.getElementById('navigation-list');
            listEl.innerHTML = '';
            
            worksheetData.forEach((item, idx) => {
                const btn = document.createElement('button');
                btn.className = `text-left px-3 py-2 rounded-xl text-sm font-bold flex items-center gap-3 transition-colors ${idx === currentIndex ? `bg-${theme.color}-100 text-${theme.color}-700 border border-${theme.color}-200` : `text-slate-600 hover:bg-slate-50`}`;
                btn.innerHTML = `<span class="text-xl w-6 text-center">${item.Emoji || ''}</span> ${item.Display_Text} - ${item.Word}`;
                btn.onclick = () => loadItem(idx);
                btn.id = `nav-btn-${idx}`;
                
                // Add Checkmark if done
                const isDone = localStorage.getItem(`lumibell_done_${currentCategory}_${item.Item_ID}`);
                if(isDone) {
                    btn.innerHTML += `<i class="fa-solid fa-check-circle text-green-500 ml-auto"></i>`;
                }

                listEl.appendChild(btn);
            });
            updateProgressText();
        }

        function updateProgressText() {
            let done = 0;
            worksheetData.forEach(item => {
                if(localStorage.getItem(`lumibell_done_${currentCategory}_${item.Item_ID}`)) done++;
            });
            document.getElementById('header-progress').innerText = `${done}/${worksheetData.length} Selesai`;
        }

        function loadItem(idx) {
            // Save current canvas before switching
            saveCanvasState();

            currentIndex = idx;
            currentItem = worksheetData[idx];
            
            // Update Sidebar UI
            document.querySelectorAll('#navigation-list button').forEach(b => {
                b.className = `text-left px-3 py-2 rounded-xl text-sm font-bold flex items-center gap-3 transition-colors text-slate-600 hover:bg-slate-50`;
            });
            const activeBtn = document.getElementById(`nav-btn-${idx}`);
            if(activeBtn) {
                activeBtn.className = `text-left px-3 py-2 rounded-xl text-sm font-bold flex items-center gap-3 transition-colors bg-${theme.color}-100 text-${theme.color}-700 border border-${theme.color}-200`;
                activeBtn.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
            }

            // Update Header
            let priColor = currentItem.Primary_Color || theme.hex;
            document.getElementById('header-badge').innerText = currentItem.Display_Text.split(' ')[0] || currentItem.Emoji;
            document.getElementById('header-badge').style.backgroundColor = `${priColor}20`; // 20% opacity
            document.getElementById('header-badge').style.color = priColor;
            
            document.getElementById('header-tag').style.backgroundColor = `${priColor}20`;
            document.getElementById('header-tag').style.color = priColor;
            document.getElementById('header-tag').innerText = `Mengenal ${currentItem.Word}`;
            
            document.getElementById('header-title').innerText = `${currentItem.Display_Text} — ${currentItem.Word}`;
            
            // Update Guide
            document.getElementById('guide-display').innerText = currentItem.Display_Text.split(' ')[0] || currentItem.Emoji;
            document.getElementById('guide-display').style.color = priColor;
            document.getElementById('guide-text').innerText = currentItem.Guide_Text;
            
            // Update Audio
            document.getElementById('btn-sound').onclick = () => speakText(`${currentItem.Display_Text}... ${currentItem.Word}. ${currentItem.Guide_Text}`);
            
            // Render Illustration
            const illuContainer = document.getElementById('illustration-container');
            if (currentItem.SVG_Code && currentItem.SVG_Code.includes('<svg')) {
                illuContainer.innerHTML = `
                    <div class="absolute top-2 left-2 text-[10px] font-bold bg-white border px-2 py-0.5 rounded-full z-10" style="color: ${priColor}; border-color: ${priColor}">Warna & Tebalkan!</div>
                    <div id="svg-color-obj" class="w-full h-44 flex items-center justify-center">${currentItem.SVG_Code}</div>
                    <div class="text-center font-bold text-slate-700 mt-2 text-lg uppercase tracking-wide">${currentItem.Word}</div>
                `;
                document.getElementById('fill-palette-box').classList.remove('hidden');
                setupMewarnaiListener();
            } else {
                const imgCacheBust = window._iconVersion || (window._iconVersion = Date.now());
                const imgPath = `Icon/${currentItem.Word}.png?v=${imgCacheBust}`;
                illuContainer.innerHTML = `
                    <div class="h-44 w-full flex items-center justify-center py-2 relative">
                        <img src="${imgPath}" alt="${currentItem.Word}" class="max-h-full max-w-full object-contain animate-float absolute inset-0 m-auto" onerror="this.style.display='none'; document.getElementById('emoji-fallback').classList.remove('hidden');" />
                        <div id="emoji-fallback" class="text-8xl flex items-center justify-center animate-float h-full hidden">${currentItem.Emoji}</div>
                    </div>
                    <div class="text-center font-bold text-slate-700 mt-2 text-lg uppercase tracking-wide">${currentItem.Word}</div>
                `;
                document.getElementById('fill-palette-box').classList.add('hidden');
            }

            // Reset Selesai button state
            const isDone = localStorage.getItem(`lumibell_done_${currentCategory}_${currentItem.Item_ID}`);
            const btnFinish = document.getElementById('btn-finish');
            if(isDone) {
                btnFinish.innerHTML = `<i class="fa-solid fa-check-double"></i> SUDAH SELESAI`;
                btnFinish.classList.replace(`bg-${theme.color}-500`, 'bg-green-500');
            } else {
                btnFinish.innerHTML = `<i class="fa-solid fa-star"></i> SELESAI!`;
                btnFinish.classList.replace('bg-green-500', `bg-${theme.color}-500`);
            }

            // Render Background Grid
            renderBackgroundGrid(priColor);

            // Init Canvas and Load Saved State
            initCanvas();
            loadCanvasState();

            // Set Mascot
            speakText(`Ini ${currentItem.Word}`);
            document.getElementById('lumi-bubble').innerText = `"Ayo belajar ${currentItem.Display_Text}!"`;
            document.getElementById('lumi-smile').setAttribute('d', 'M29 32C29 33.6569 30.3431 35 32 35C33.6569 35 35 33.6569 35 32'); // reset smile
        }

        function renderBackgroundGrid(priColor) {
            const bgEl = document.getElementById('grid-background');
            bgEl.innerHTML = '';

            let mainChar = currentItem.Display_Text.split(' ')[0] || '?';
            let subChar = currentItem.Display_Text.split(' ')[1] || mainChar;
            let wordLower = currentItem.Word.toLowerCase();

            if (currentCategory === 'alphabet') {
                bgEl.innerHTML = `
                    <div class="flex flex-col justify-around h-full p-3 opacity-70">
                        <div class="h-[100px] w-full tracing-guideline relative flex justify-around px-4">
                            ${Array(5).fill(`<span class="dotted-letter">${mainChar}</span>`).join('')}
                        </div>
                        <div class="h-[100px] w-full tracing-guideline relative flex justify-around px-4">
                            ${Array(5).fill(`<span class="dotted-letter">${subChar}</span>`).join('')}
                        </div>
                        <div class="h-[100px] w-full tracing-guideline relative flex justify-around px-4 pt-10">
                            ${Array(5).fill(`<div class="w-3.5 h-3.5 bg-slate-800 rounded-full"></div>`).join('')}
                        </div>
                    </div>
                `;
            } else if (currentCategory === 'number') {
                bgEl.innerHTML = `
                    <div class="flex flex-col justify-around h-full p-3 opacity-70">
                        <div class="h-[100px] w-full tracing-guideline relative flex justify-around px-4">
                            ${Array(5).fill(`<span class="dotted-letter">${mainChar}</span>`).join('')}
                        </div>
                        <div class="h-[100px] w-full tracing-guideline relative flex justify-around px-4 items-center">
                            ${Array(3).fill(`<span class="dotted-letter" style="font-size:3rem; letter-spacing:0.05em">${wordLower}</span>`).join('')}
                        </div>
                        <div class="h-[100px] w-full tracing-guideline relative flex justify-around px-4 pt-10">
                            ${Array(5).fill(`<div class="w-3.5 h-3.5 bg-slate-800 rounded-full"></div>`).join('')}
                        </div>
                    </div>
                `;
            } else if (currentCategory === 'shape' || currentCategory === 'warmup') {
                // Blank canvas with just dashed border inside
                bgEl.innerHTML = `
                    <div class="absolute inset-4 border-4 border-dashed rounded-xl opacity-30" style="border-color: ${priColor}"></div>
                    <div class="absolute inset-0 flex items-center justify-center opacity-10">
                        <span style="font-size: 15rem">${currentItem.Emoji}</span>
                    </div>
                `;
            }
        }

        // --- Navigation ---
        function prevItem() {
            if (currentIndex > 0) loadItem(currentIndex - 1);
        }
        function nextItem() {
            if (currentIndex < worksheetData.length - 1) loadItem(currentIndex + 1);
        }

        // --- Canvas Engine ---
        let brushColor = '#3b82f6';
        let brushSize = 10;
        let isDrawing = false;
        let lastX = 0, lastY = 0;
        let isRainbow = false;
        let hue = 0;
        const canvas = document.getElementById('main-canvas');
        const ctx = canvas.getContext('2d');

        function initCanvas() {
            // Reset context size
            canvas.width = canvas.offsetWidth;
            canvas.height = canvas.offsetHeight;
            ctx.lineCap = 'round';
            ctx.lineJoin = 'round';
            ctx.clearRect(0, 0, canvas.width, canvas.height);
        }

        // Precise coordinate calculation for Touch and Mouse scaling
        function getPos(e) {
            const rect = canvas.getBoundingClientRect();
            const scaleX = canvas.width / rect.width;
            const scaleY = canvas.height / rect.height;
            if (e.touches && e.touches.length > 0) {
                return {
                    x: (e.touches[0].clientX - rect.left) * scaleX,
                    y: (e.touches[0].clientY - rect.top) * scaleY
                };
            } else {
                return {
                    x: (e.clientX - rect.left) * scaleX,
                    y: (e.clientY - rect.top) * scaleY
                };
            }
        }

        // Events
        canvas.addEventListener('mousedown', startDrawing);
        canvas.addEventListener('mousemove', draw);
        canvas.addEventListener('mouseup', stopDrawing);
        canvas.addEventListener('mouseout', stopDrawing);

        // Passive false is important to prevent default scroll
        canvas.addEventListener('touchstart', (e) => { e.preventDefault(); startDrawing(e); }, { passive: false });
        canvas.addEventListener('touchmove', (e) => { e.preventDefault(); draw(e); }, { passive: false });
        canvas.addEventListener('touchend', (e) => { e.preventDefault(); stopDrawing(e); }, { passive: false });

        function startDrawing(e) {
            isDrawing = true;
            const pos = getPos(e);
            lastX = pos.x;
            lastY = pos.y;
        }

        function draw(e) {
            if (!isDrawing) return;
            const pos = getPos(e);
            
            ctx.beginPath();
            ctx.moveTo(lastX, lastY);
            ctx.lineTo(pos.x, pos.y);

            if (isRainbow) {
                ctx.strokeStyle = `hsl(${hue}, 100%, 50%)`;
                hue = (hue + 2) % 360;
            } else {
                ctx.strokeStyle = brushColor;
            }

            ctx.lineWidth = brushSize;
            ctx.stroke();

            lastX = pos.x;
            lastY = pos.y;
        }

        function stopDrawing(e) {
            if (!isDrawing) return;
            isDrawing = false;
            saveCanvasState(); // Save locally on stroke end
        }

        // --- Toolbar ---
        function setBrushColor(color, btn) {
            document.querySelectorAll('.color-btn').forEach(b => {
                b.classList.remove('scale-110', 'ring-2', 'ring-indigo-500/50');
                b.classList.add('hover:scale-105');
            });
            btn.classList.add('scale-110', 'ring-2', 'ring-indigo-500/50');
            btn.classList.remove('hover:scale-105');

            isRainbow = (color === 'rainbow');
            if(!isRainbow) brushColor = color;
        }

        function updateBrushSize(val) {
            brushSize = val;
            document.getElementById('brush-size-val').innerText = `${val}px`;
        }

        function resetCanvasCurrent() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            // Hapus dari localStorage gambar saja, biarkan status "Done" jika ada
            const imgKey = `lumibell_canvas_${currentCategory}_${currentItem.Item_ID}`;
            localStorage.removeItem(imgKey);
            document.getElementById('saved-canvas-img').classList.add('hidden');
            document.getElementById('saved-canvas-img').src = '';
            speakText("Bersih!");
        }

        // --- Local Storage Progress ---
        function saveCanvasState() {
            if(!currentItem) return;
            const dataURL = canvas.toDataURL();
            const key = `lumibell_canvas_${currentCategory}_${currentItem.Item_ID}`;
            localStorage.setItem(key, dataURL);
        }

        function loadCanvasState() {
            const key = `lumibell_canvas_${currentCategory}_${currentItem.Item_ID}`;
            const dataURL = localStorage.getItem(key);
            const savedImg = document.getElementById('saved-canvas-img');
            if(dataURL) {
                savedImg.src = dataURL;
                savedImg.classList.remove('hidden');
            } else {
                savedImg.classList.add('hidden');
                savedImg.src = '';
            }
        }

        // --- Mewarnai SVG ---
        let fillModeColor = '#ef4444';
        function setFillObjectColor(color) {
            fillModeColor = color;
        }
        function setFillColor(color) {
            fillModeColor = color;
        }
        function setupMewarnaiListener() {
            const svgEl = document.getElementById('svg-color-obj');
            if (svgEl) {
                const paintables = svgEl.querySelectorAll('.paintable');
                paintables.forEach(elem => {
                    elem.addEventListener('click', function(e) {
                        e.stopPropagation();
                        this.setAttribute('fill', fillModeColor);
                        // Save SVG state could be complex, omitting for now, just for fun
                    });
                });
            }
        }

        // --- Selesai Button ---
        function markFinished() {
            const doneKey = `lumibell_done_${currentCategory}_${currentItem.Item_ID}`;
            localStorage.setItem(doneKey, "true");
            
            // Visual Feedback
            playSuccessSound();
            createConfetti();
            document.getElementById('lumi-bubble').innerText = `"Wah pintar sekali! Kerja bagus!"`;
            document.getElementById('lumi-smile').setAttribute('d', 'M25 30 Q32 40 39 30'); // open smile
            
            const btnFinish = document.getElementById('btn-finish');
            btnFinish.innerHTML = `<i class="fa-solid fa-check-double"></i> SUDAH SELESAI`;
            btnFinish.classList.replace(`bg-${theme.color}-500`, 'bg-green-500');

            renderSidebarList(); // Update checkmarks
        }

        function createConfetti() {
            for(let i=0; i<30; i++) {
                let conf = document.createElement('div');
                conf.className = 'confetti-piece';
                conf.style.left = Math.random() * 100 + 'vw';
                conf.style.backgroundColor = ['#ef4444', '#3b82f6', '#10b981', '#f59e0b', '#a855f7'][Math.floor(Math.random()*5)];
                conf.style.animationDuration = (Math.random() * 2 + 2) + 's';
                document.body.appendChild(conf);
                setTimeout(() => conf.remove(), 4000);
            }
        }

        // --- Audio TTS ---
        const synth = window.speechSynthesis;
        function speakText(text) {
            if ('speechSynthesis' in window) {
                synth.cancel();
                const utterance = new SpeechSynthesisUtterance(text);
                utterance.lang = 'id-ID';
                utterance.rate = 0.9;
                utterance.pitch = 1.3;
                synth.speak(utterance);
            }
        }
    </script>
</body>
</html>
