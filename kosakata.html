    const categoryConfig = {
        "Anggota Tubuh":     {emoji:"&#x1FAC0;", color:"bg-red-100 text-red-700 border-red-300"},
        "Buah-buahan":       {emoji:"&#x1F34E;", color:"bg-orange-100 text-orange-700 border-orange-300"},
        "Sayuran":           {emoji:"&#x1F966;", color:"bg-green-100 text-green-700 border-green-300"},
        "Hewan":             {emoji:"&#x1F43E;", color:"bg-yellow-100 text-yellow-700 border-yellow-300"},
        "Warna":             {emoji:"&#x1F3A8;", color:"bg-purple-100 text-purple-700 border-purple-300"},
        "Keluarga":          {emoji:"&#x1F46A;", color:"bg-pink-100 text-pink-700 border-pink-300"},
        "Angka":             {emoji:"&#x1F522;", color:"bg-blue-100 text-blue-700 border-blue-300"},
        "Hari & Bulan":      {emoji:"&#x1F4C5;", color:"bg-cyan-100 text-cyan-700 border-cyan-300"},
        "Alat Sekolah":      {emoji:"&#x270F;", color:"bg-indigo-100 text-indigo-700 border-indigo-300"},
        "Makanan & Minuman": {emoji:"&#x1F35C;", color:"bg-amber-100 text-amber-700 border-amber-300"},
        "Tempat":            {emoji:"&#x1F3E0;", color:"bg-teal-100 text-teal-700 border-teal-300"},
        "Kata Kerja":        {emoji:"&#x1F3C3;", color:"bg-lime-100 text-lime-700 border-lime-300"},
        "Kata Sifat":        {emoji:"&#x1F4A1;", color:"bg-rose-100 text-rose-700 border-rose-300"},
    };

    let activeFilter = "all";

    function buildFilters() {
        const container = document.getElementById("filter-buttons");
        const categories = [...new Set(vocab.map(v => v.id))];
        categories.forEach(cat => {
            const cfg = categoryConfig[cat] || {emoji:"&#x1F4CC;", color:"bg-slate-100 text-slate-700 border-slate-300"};
            const btn = document.createElement("button");
            btn.className = "filter-btn bg-white border-2 border-amber-200 text-slate-700 font-bold px-4 py-1.5 rounded-full text-sm hover:bg-amber-100 transition";
            btn.dataset.category = cat;
            btn.innerHTML = cfg.emoji + " " + cat;
            btn.onclick = function() { setFilter(cat, this); };
            container.appendChild(btn);
        });
    }

    function setFilter(category, btn) {
        activeFilter = category;
        document.querySelectorAll(".filter-btn").forEach(b => {
            b.classList.remove("active","bg-amber-400","text-amber-900");
            b.classList.add("bg-white","border-amber-200","text-slate-700");
        });
        btn.classList.add("active","bg-amber-400","text-amber-900");
        btn.classList.remove("bg-white","border-amber-200","text-slate-700");
        filterTable();
    }

    function filterTable() {
        const q = (document.getElementById("search-input").value || "").toLowerCase().trim();
        const tbody = document.getElementById("vocab-body");
        tbody.innerHTML = "";

        const filtered = vocab.filter(v => {
            const matchCat = activeFilter === "all" || v.id === activeFilter;
            const matchSearch = !q || v.in.toLowerCase().includes(q) || v.en.toLowerCase().includes(q) || v.ngoko.toLowerCase().includes(q) || v.krama.toLowerCase().includes(q);
            return matchCat && matchSearch;
        });

        filtered.forEach((v, i) => {
            const cfg = categoryConfig[v.id] || {emoji:"&#x1F4CC;", color:"bg-slate-100 text-slate-700 border-slate-300"};
            const row = document.createElement("tr");
            row.className = "vocab-row border-b border-amber-50" + (i%2===0?" bg-white":" bg-amber-50/40");
            row.innerHTML =
                '<td class="py-2.5 px-4 text-slate-400 text-xs font-bold no-print">' + (i+1) + '</td>' +
                '<td class="py-2.5 px-4 font-bold text-slate-800">' + v.in + '</td>' +
                '<td class="py-2.5 px-4 text-blue-700 font-medium">' + v.en + '</td>' +
                '<td class="py-2.5 px-4 text-green-700 font-medium">' + v.ngoko + '</td>' +
                '<td class="py-2.5 px-4 text-purple-700 font-medium">' + v.krama + '</td>' +
                '<td class="py-2.5 px-4 no-print"><span class="inline-block text-xs font-bold px-2 py-0.5 rounded-full border ' + cfg.color + '">' + cfg.emoji + ' ' + v.id + '</span></td>';
            tbody.appendChild(row);
        });

        document.getElementById("result-count").textContent = filtered.length;
        const lbl = document.getElementById("print-category-label");
        if(lbl) lbl.textContent = activeFilter === "all" ? "Semua Kategori" : "Kategori: " + activeFilter;
    }

    buildFilters();
    filterTable();
    </script>
